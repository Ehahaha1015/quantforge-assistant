server {
    listen 8080;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Canonical local origin also matches the API's existing origin policy.
    if ($host = localhost) {
        return 308 http://127.0.0.1:4180$request_uri;
    }
    if ($host !~ ^127\.0\.0\.1$) {
        return 403;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location /gateway/ {
        set $api_host api:4188;
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass http://$api_host;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4188;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 7m;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
