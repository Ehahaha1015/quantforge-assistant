[project]
name = "qf-lab"
version = "0.1.0"
description = "Isolated AI research intelligence for QuantForge"
requires-python = ">=3.12"
dependencies = ["quantforge", "pydantic>=2", "PyYAML>=6"]

[project.scripts]
qf-lab = "qf_lab.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
quantforge = { path = "../quantforge", editable = true }

[tool.uv]
constraint-dependencies = ["polars==1.44.2", "pydantic==2.13.5", "duckdb==1.5.5"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7", "mypy==2.3.1"]
